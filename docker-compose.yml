services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8000:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/product-activation-realm.json:/opt/keycloak/data/import/product-activation-realm.json:ro
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activation
      SPRING_DATASOURCE_USERNAME: activation
      SPRING_DATASOURCE_PASSWORD: activation
      SPRING_PROFILES_ACTIVE: mock-provider
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  keycloak_data:
